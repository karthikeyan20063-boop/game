<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karthikeyan Platform Adventure</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* GAME */
#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#62c8ff 0%, #bcecff 65%, #e9f7ff 100%);
}

/* SKY */
#sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 18%, white 0 28px, transparent 29px),
        radial-gradient(circle at 75% 25%, white 0 35px, transparent 36px);
    opacity: .65;
}

/* CLOUDS */
.cloud {
    position: absolute;
    width: 130px;
    height: 40px;
    background: white;
    border-radius: 50px;
    opacity: .85;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    top: -25px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    top: -35px;
}

/* WORLD */
#world {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 6000px;
}

/* GROUND */
.ground {
    position: absolute;
    height: 110px;
    background:
        repeating-linear-gradient(
            45deg,
            #39a852 0,
            #39a852 15px,
            #27883e 15px,
            #27883e 30px
        );
    border-top: 8px solid #17682b;
}

/* PLATFORM */
.platform {
    position: absolute;
    height: 30px;
    background: linear-gradient(#c98245, #8a4b24);
    border: 4px solid #65351b;
    border-radius: 5px;
    box-shadow: inset 0 5px rgba(255,255,255,.15);
}

/* BRICK */
.brick {
    position: absolute;
    width: 55px;
    height: 55px;
    background: linear-gradient(#e99a45, #b96027);
    border: 4px solid #713518;
    border-radius: 5px;
}

/* COIN */
.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffd21c;
    border: 4px solid #d99b00;
    box-shadow: 0 0 12px #ffd21c;
    animation: coinSpin .7s infinite alternate;
}

@keyframes coinSpin {
    from {
        transform: scaleX(1);
    }
    to {
        transform: scaleX(.35);
    }
}

/* PLAYER */
#player {
    position: absolute;
    width: 42px;
    height: 55px;
    z-index: 20;
}

/* PLAYER BODY */
#player .head {
    position: absolute;
    width: 34px;
    height: 30px;
    left: 4px;
    top: 0;
    background: #ffd0a8;
    border-radius: 50%;
    border: 3px solid #7b351e;
}

#player .hat {
    position: absolute;
    width: 40px;
    height: 13px;
    left: 1px;
    top: -3px;
    background: #e32626;
    border-radius: 15px 15px 4px 4px;
    z-index: 2;
}

#player .body {
    position: absolute;
    width: 38px;
    height: 30px;
    left: 2px;
    top: 25px;
    background: #276be5;
    border-radius: 8px;
}

#player .shoe1,
#player .shoe2 {
    position: absolute;
    width: 18px;
    height: 8px;
    bottom: -2px;
    background: #612f1e;
    border-radius: 8px;
}

#player .shoe1 {
    left: 2px;
}

#player .shoe2 {
    right: 2px;
}

/* ENEMY */
.enemy {
    position: absolute;
    width: 42px;
    height: 35px;
    background: #753bd0;
    border: 4px solid #45217c;
    border-radius: 20px 20px 8px 8px;
    z-index: 10;
}

.enemy::before,
.enemy::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    top: 7px;
}

.enemy::before {
    left: 8px;
}

.enemy::after {
    right: 8px;
}

/* STAR */
.star {
    position: absolute;
    width: 36px;
    height: 36px;
    background: #ffe900;
    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 100%,
        50% 73%,
        21% 100%,
        32% 57%,
        2% 35%,
        39% 35%
    );
    filter: drop-shadow(0 0 8px #ffe900);
    animation: starMove .6s infinite alternate;
}

@keyframes starMove {
    to {
        transform: translateY(-7px) rotate(10deg);
    }
}

/* FLAG */
.flag {
    position: absolute;
    width: 10px;
    height: 170px;
    background: #444;
    border-radius: 5px;
}

.flag::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 0;
    width: 75px;
    height: 50px;
    background: #ff3150;
    clip-path: polygon(0 0, 100% 20%, 0 100%);
}

/* HUD */
#hud {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(900px, 94vw);
    height: 65px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    background: rgba(0,0,0,.65);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 15px;

    color: white;
    z-index: 100;
    backdrop-filter: blur(10px);
}

.stat {
    text-align: center;
}

.stat small {
    display: block;
    color: #bbb;
    font-size: 10px;
}

.stat b {
    color: #ffd21c;
    font-size: 18px;
}

/* MESSAGE */
#message {
    position: fixed;
    left: 50%;
    top: 105px;
    transform: translateX(-50%);
    z-index: 100;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: .3s;
}

/* MENU */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,8,20,.88);
    backdrop-filter: blur(10px);

    z-index: 200;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    text-align: center;
}

.overlay h1 {
    font-size: clamp(35px, 7vw, 70px);
    color: #ffd21c;
    text-shadow: 0 5px #b46c00;
}

.overlay p {
    color: #ccc;
    margin: 15px;
    line-height: 1.7;
}

button {
    border: none;
    background: #e32626;
    color: white;
    padding: 15px 35px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px #8b1515;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px #8b1515;
}

#developer {
    margin-top: 30px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
}

#developer span {
    color: #ffd21c;
}

/* MOBILE */
#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: none;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 150;
}

.mobileGroup {
    display: flex;
    gap: 12px;
}

.mobileBtn {
    width: 65px;
    height: 55px;
    padding: 0;
    border-radius: 15px;
    background: rgba(0,0,0,.65);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,.2);
}

@media(max-width:700px) {
    #mobileControls {
        display: flex;
    }

    #hud {
        height: 55px;
    }

    .stat b {
        font-size: 14px;
    }

    .stat small {
        font-size: 8px;
    }
}
</style>
</head>

<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

const scoreDisplay =
    document.getElementById("score");

const coinsDisplay =
    document.getElementById("coins");

const livesDisplay =
    document.getElementById("lives");

const levelDisplay =
    document.getElementById("level");

const message =
    document.getElementById("message");

const startMenu =
    document.getElementById("startMenu");


/* GAME DATA */

let x = 100;
let y = 0;

let velocityX = 0;
let velocityY = 0;

let speed = 5;
let jumpPower = 14;
let gravity = .65;

let onGround = false;

let score = 0;
let coins = 0;
let lives = 3;

let level = 1;

let gameStarted = false;
let gameOver = false;

let cameraX = 0;

let left = false;
let right = false;

let jump = false;

let collectedCoins = new Set();
let defeatedEnemies = new Set();


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") {
        left = true;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        right = true;
    }

    if (
        e.key === "ArrowUp" ||
        e.key === "w" ||
        e.key === " "
    ) {
        jump = true;
    }

});


document.addEventListener("keyup", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") {
        left = false;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        right = false;
    }

    if (
        e.key === "ArrowUp" ||
        e.key === "w" ||
        e.key === " "
    ) {
        jump = false;
    }

});


/* MOBILE */

function holdButton(btn, variable) {

    btn.addEventListener("touchstart", e => {
        e.preventDefault();
        window[variable] = true;
    });

    btn.addEventListener("touchend", e => {
        e.preventDefault();
        window[variable] = false;
    });

    btn.addEventListener("mousedown", () => {
        window[variable] = true;
    });

    btn.addEventListener("mouseup", () => {
        window[variable] = false;
    });

}

holdButton(
    document.getElementById("leftBtn"),
    "left"
);

holdButton(
    document.getElementById("rightBtn"),
    "right"
);

holdButton(
    document.getElementById("jumpBtn"),
    "jump"
);


/* START */

function startGame() {

    startMenu.style.display = "none";

    gameStarted = true;

    resetPlayer();

    requestAnimationFrame(gameLoop);

    showMessage(
        "LEVEL 1 — BEGIN YOUR ADVENTURE!"
    );

}


/* MESSAGE */

function showMessage(text) {

    message.innerText = text;

    message.style.opacity = 1;

    setTimeout(() => {
        message.style.opacity = 0;
    }, 2200);

}


/* PLAYER RESET */

function resetPlayer() {

    x = 100;

    y = 0;

    velocityX = 0;

    velocityY = 0;

    cameraX = 0;

}


/* RECTANGLE */

function rect(el) {

    return el.getBoundingClientRect();

}


/* COLLISION */

function isColliding(a, b) {

    return !(
        a.right < b.left ||
        a.left > b.right ||
        a.bottom < b.top ||
        a.top > b.bottom
    );

}


/* PLAYER */

function updatePlayer() {

    if (left) {
        velocityX = -speed;
    }
    else if (right) {
        velocityX = speed;
    }
    else {
        velocityX *= .75;
    }


    x += velocityX;


    /* JUMP */

    if (
        jump &&
        onGround
    ) {

        velocityY = -jumpPower;

        onGround = false;

    }


    velocityY += gravity;

    y += velocityY;


    /* WORLD LIMIT */

    if (x < 0) {
        x = 0;
    }


    /* GROUND */

    const groundTop =
        game.clientHeight - 110;

    if (
        y >=
        groundTop - 55
    ) {

        y =
            groundTop - 55;

        velocityY = 0;

        onGround = true;

    }
    else {

        onGround = false;

    }


    player.style.left =
        x + "px";

    player.style.bottom =
        "auto";

    player.style.top =
        y + "px";

}


/* PLATFORM COLLISION */

function platformCollision() {

    const platforms =
        document.querySelectorAll(".platform");

    const pRect =
        rect(player);

    platforms.forEach(platform => {

        const r = rect(platform);

        if (
            pRect.bottom >= r.top &&
            pRect.bottom <= r.top + 25 &&
            pRect.right > r.left &&
            pRect.left < r.right &&
            velocityY >= 0
        ) {

            y =
                platform.offsetTop -
                player.offsetHeight;

            velocityY = 0;

            onGround = true;

        }

    });

}


/* COINS */

function collectCoins() {

    const items =
        document.querySelectorAll(".coin");

    items.forEach((coin, index) => {

        if (
            collectedCoins.has(index)
        ) {
            return;
        }

        if (
            isColliding(
                rect(player),
                rect(coin)
            )
        ) {

            collectedCoins.add(index);

            coin.style.display =
                "none";

            coins++;

            score += 100;

            coinsDisplay.innerText =
                coins;

            scoreDisplay.innerText =
                score;

            showMessage("+100 COINS!");

        }

    });

}


/* ENEMIES */

function enemyCollision() {

    const enemies =
        document.querySelectorAll(".enemy");

    enemies.forEach((enemy, index) => {

        if (
            defeatedEnemies.has(index)
        ) {
            return;
        }


        if (
            isColliding(
                rect(player),
                rect(enemy)
            )
        ) {

            const p =
                rect(player);

            const e =
                rect(enemy);


            /* Jump on enemy */

            if (
                velocityY > 0 &&
                p.bottom - e.top < 25
            ) {

                defeatedEnemies.add(index);

                enemy.style.display =
                    "none";

                velocityY =
                    -jumpPower * .65;

                score += 250;

                scoreDisplay.innerText =
                    score;

                showMessage(
                    "ENEMY DEFEATED! +250"
                );

            }

            else {

                loseLife();

            }

        }

    });

}


/* LOSE LIFE */

function loseLife() {

    lives--;

    livesDisplay.innerText =
        lives;

    if (lives <= 0) {

        endGame();

        return;

    }

    showMessage(
        "OUCH! LIFE LOST!"
    );

    resetPlayer();

}


/* STAR */

function collectStars() {

    const stars =
        document.querySelectorAll(".star");

    stars.forEach((star, index) => {

        if (
            star.dataset.collected
        ) {
            return;
        }

        if (
            isColliding(
                rect(player),
                rect(star)
            )
        ) {

            star.dataset.collected =
                "true";

            star.style.display =
                "none";

            score += 1000;

            scoreDisplay.innerText =
                score;

            showMessage(
                "⭐ POWER STAR! +1000"
            );

        }

    });

}


/* FINISH */

function checkFinish() {

    const flag =
        document.querySelector(".flag");

    if (
        isColliding(
            rect(player),
            rect(flag)
        )
    ) {

        if (level < 5) {

            level++;

            levelDisplay.innerText =
                level + " / 5";

            showMessage(
                "LEVEL COMPLETE! 🎉"
            );

            resetPlayer();

            setTimeout(() => {

                showMessage(
                    "LEVEL " +
                    level +
                    " — KEEP GOING!"
                );

            }, 1000);

        }
        else {

            winGame();

        }

    }

}


/* CAMERA */

function updateCamera() {

    const screenCenter =
        game.clientWidth / 2;

    if (
        x > screenCenter
    ) {

        cameraX =
            x - screenCenter;

    }

    if (cameraX < 0) {
        cameraX = 0;
    }

    if (
        cameraX >
        world.offsetWidth -
        game.clientWidth
    ) {

        cameraX =
            world.offsetWidth -
            game.clientWidth;

    }

    world.style.transform =
        "translateX(-" +
        cameraX +
        "px)";

}


/* GAME LOOP */

function gameLoop() {

    if (
        !gameStarted ||
        gameOver
    ) {
        return;
    }


    updatePlayer();

    platformCollision();

    collectCoins();

    collectStars();

    enemyCollision();

    checkFinish();

    updateCamera();


    /* FALL */

    if (
        y >
        game.clientHeight + 100
    ) {

        loseLife();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* GAME OVER */

function endGame() {

    gameOver = true;

    showMessage(
        "GAME OVER"
    );

    setTimeout(() => {

        startMenu.style.display =
            "flex";

        startMenu.innerHTML = `

            <h1>GAME OVER</h1>

            <p>
                Your Score: ${score}<br>
                Coins Collected: ${coins}
            </p>
